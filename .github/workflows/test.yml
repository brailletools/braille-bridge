name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      # Several tests (lex-formatting, the CLI long-line test) assert on real
      # back-translated English, which needs the system lou_translate binary;
      # without it they either fail or skip silently.
      - name: Install liblouis (lou_translate)
        run: sudo apt-get update && sudo apt-get install -y liblouis-bin

      - name: Run tests
        run: pnpm test
